<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eldr Documentation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #fbfaf8; --panel: #f3f1ed; --fg: #1d1b18; --muted: #6a645b; --line: #e3dfd8;
  --accent: #c2410c; --accent-soft: #fdeee4; --code-bg: #f0ede7; --mark: #fde68a;
  --font: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --nav-w: 280px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15130f; --panel: #1d1a16; --fg: #ebe6de; --muted: #a39b8f; --line: #2f2b25;
  --accent: #fb8a4a; --accent-soft: #2c1d13; --code-bg: #241f1a; --mark: #7c5d12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1d1a16; --fg: #ebe6de; --muted: #a39b8f; --line: #2f2b25;
  --accent: #fb8a4a; --accent-soft: #2c1d13; --code-bg: #241f1a; --mark: #7c5d12; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
#q { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; width: 100%; }
#q:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hits { font-size: 12px; color: var(--muted); min-height: 1em; }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc .doc { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
.toc a { display: block; color: var(--fg); text-decoration: none; font-size: 13.5px; padding: 3px 8px; border-radius: 5px; border-left: 2px solid transparent; }
.toc a:hover { background: var(--accent-soft); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.toc a.dim { opacity: 0.35; }
main { min-width: 0; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 120px 48px; }
article { max-width: 920px; }
article > section.doc + section.doc { border-top: 1px solid var(--line); margin-top: 56px; padding-top: 24px; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
h2 { font-size: 21px; font-weight: 600; margin: 40px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 16px; }
h3 { font-size: 16.5px; font-weight: 600; margin: 26px 0 6px; scroll-margin-top: 16px; }
h1, h2, h3 { scroll-margin-top: 16px; }
p, li { max-width: 74ch; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
pre code { padding: 0; background: none; }
.tw { overflow-x: auto; margin: 12px 0 20px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; background: var(--panel); position: sticky; top: 0; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { min-width: 180px; }
td:first-child code { white-space: nowrap; }
.yn { font-weight: 600; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.yn.yes { color: #1f7a3a; background: #e3f4e8; } .yn.partial { color: #8a5a00; background: #fbf0d9; } .yn.no { color: #a33232; background: #f9e4e4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .yn.yes { color: #7ddc98; background: #183323; } :root:not([data-theme="light"]) .yn.partial { color: #f0c46b; background: #33280f; } :root:not([data-theme="light"]) .yn.no { color: #f29a9a; background: #3a1c1c; } }
:root[data-theme="dark"] .yn.yes { color: #7ddc98; background: #183323; } :root[data-theme="dark"] .yn.partial { color: #f0c46b; background: #33280f; } :root[data-theme="dark"] .yn.no { color: #f29a9a; background: #3a1c1c; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.hidden { display: none !important; }
#menu { display: none; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 20; transform: translateX(-102%); transition: transform 0.2s; box-shadow: 0 0 40px rgba(0,0,0,0.2); }
  nav.open { transform: none; }
  #menu { display: inline-flex; position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 21; font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 0; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 100px max(16px, env(safe-area-inset-left, 0px)); }
}
/* Chapters: one shown at a time (all while searching); the nav lists the active chapter's sections. */
body:not(.searching) section.doc:not(.current) { display: none; }
body:not(.searching) article > section.doc + section.doc { border-top: 0; margin-top: 0; padding-top: 0; }
.toc .part { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.toc a.chapter { font-weight: 500; }
.toc .subs { display: none; flex-direction: column; gap: 1px; margin: 2px 0 6px 10px; border-left: 1px solid var(--line); }
.toc .subs.open, body.searching .toc .subs { display: flex; }
.toc .subs a { font-size: 13px; color: var(--muted); }
.toc .subs a.active { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); }
.pager a { text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; max-width: 48%; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.pager .next { margin-left: auto; text-align: right; }
body.searching .pager { display: none; }
/* Pictures: alt text is the caption; paragraphs of pictures become a grid of before/after. */
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; margin: 16px 0 24px; max-width: 100%; }
figure { margin: 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
figcaption { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 6px; }
.shot { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; border: 2px dashed var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 13px; text-align: center; padding: 12px; }
/* Callouts: blockquotes starting with Tip:, Note:, Warning: or Where in Houdini:. */
blockquote { margin: 16px 0; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--panel); border-radius: 0 8px 8px 0; max-width: 74ch; }
blockquote p { margin: 4px 0; }
blockquote.tip { border-left-color: #1f7a3a; } blockquote.note { border-left-color: #3b6fb6; }
blockquote.warning { border-left-color: #b45309; background: var(--accent-soft); }
blockquote.houdini { border-left-color: var(--accent); }
blockquote.houdini strong:first-child::before { content: "\25B8  "; color: var(--accent); }
blockquote.tip, blockquote.note, blockquote.warning, blockquote.houdini { border-left-width: 4px; }
blockquote.tip { background: color-mix(in srgb, #1f7a3a 9%, var(--bg)); } blockquote.note { background: color-mix(in srgb, #3b6fb6 9%, var(--bg)); }
blockquote.tip > p:first-child > strong:first-child { color: #1f7a3a; } blockquote.note > p:first-child > strong:first-child { color: #3b6fb6; }
blockquote.warning > p:first-child > strong:first-child { color: #b45309; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) blockquote.tip > p:first-child > strong:first-child { color: #7ddc98; } :root:not([data-theme="light"]) blockquote.note > p:first-child > strong:first-child { color: #8fb4ec; } :root:not([data-theme="light"]) blockquote.warning > p:first-child > strong:first-child { color: #f0a868; } }
:root[data-theme="dark"] blockquote.tip > p:first-child > strong:first-child { color: #7ddc98; } :root[data-theme="dark"] blockquote.note > p:first-child > strong:first-child { color: #8fb4ec; } :root[data-theme="dark"] blockquote.warning > p:first-child > strong:first-child { color: #f0a868; }
/* Code blocks get a copy button. */
pre { position: relative; }
pre .copy { position: absolute; top: 6px; right: 6px; font: inherit; font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; opacity: 0.75; }
pre .copy:hover, pre .copy:focus-visible { opacity: 1; color: var(--accent); border-color: var(--accent); }
/* Home: "Where to start" cards. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; margin: 14px 0 28px; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card strong { color: var(--accent); font-size: 15.5px; }
.card span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
/* Settings reference: a card per setting, groups folded as in the UIs. */
details.sgroup { margin: 10px 0 24px; }
details.sgroup > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
.setting { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; scroll-margin-top: 16px; }
.setting.target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.setting h4 { margin: 0 0 8px; font-size: 15.5px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.setting h4 .anchor { color: var(--fg); text-decoration: none; margin-right: 4px; }
.setting h4 .anchor:hover { color: var(--accent); }
.chip { font-size: 11px; font-weight: 600; letter-spacing: 0.03em; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.chip.rt { color: #7c3aed; } .chip.film { color: #0f766e; } .chip.interactive { color: #b45309; } .chip.prepass { color: #2563eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.rt { color: #b69cf7; } :root:not([data-theme="light"]) .chip.film { color: #5eead4; } :root:not([data-theme="light"]) .chip.interactive { color: #f0a868; } :root:not([data-theme="light"]) .chip.prepass { color: #8fb4ec; } }
:root[data-theme="dark"] .chip.rt { color: #b69cf7; } :root[data-theme="dark"] .chip.film { color: #5eead4; } :root[data-theme="dark"] .chip.interactive { color: #f0a868; } :root[data-theme="dark"] .chip.prepass { color: #8fb4ec; }
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0 0 8px; font-size: 13px; }
dl.meta dt { color: var(--muted); } dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.twin { color: var(--muted); margin-left: 6px; }
.setting .what { max-width: 74ch; }
.setting .cost { margin-top: 6px; font-size: 13px; color: var(--muted); }
.setting .cost span { font-weight: 600; color: var(--fg); margin-right: 4px; }
/* "On this page", right of the text on wide screens. */
#otp { display: none; }
@media (min-width: 1280px) {
  .layout { grid-template-columns: var(--nav-w) minmax(0, 1fr) 230px; }
  #otp { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 32px 16px 40px 0; font-size: 13px; }
  #otp .h { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  #otp a { display: block; color: var(--muted); text-decoration: none; padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
  #otp a.h3 { padding-left: 22px; }
  #otp a:hover { color: var(--fg); }
  #otp a.active { color: var(--accent); border-left-color: var(--accent); }
  body.searching #otp { visibility: hidden; }
}
/* Search jumps, theme toggle, back to top. */
.jumps { display: flex; flex-direction: column; gap: 1px; }
.jumps a { display: block; font-size: 13px; color: var(--fg); text-decoration: none; padding: 3px 8px; border-radius: 5px; }
.jumps a:hover, .jumps a:focus-visible { background: var(--accent-soft); }
.jumps a small { color: var(--muted); margin-left: 6px; }
.brandrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
#theme { font: inherit; font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
#theme:hover { color: var(--accent); border-color: var(--accent); }
#top { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 5; font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
#top:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 860px) { #top { bottom: max(64px, env(safe-area-inset-bottom, 0px)); } }
/* Pictures open larger on a click: fitted to the window, a second click shows them at full size. */
#content img { cursor: zoom-in; }
#zoom { padding: 0; border: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
#zoom::backdrop { background: rgb(0 0 0 / 0.85); }
#zoom .pane { width: 100%; height: 100%; overflow: auto; display: grid; place-items: center; box-sizing: border-box; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#zoom img { max-width: 100%; max-height: calc(100vh - 72px); cursor: zoom-in; border-radius: 4px; background: #fff; }
#zoom.full .pane { place-items: start; }
#zoom.full .pane > div { width: 100%; }
#zoom.full img { max-width: none; max-height: none; min-width: 100%; cursor: zoom-out; }
#zoom p { margin: 8px auto 0; color: #ddd; font-size: 13px; text-align: center; max-width: 90ch; }
#zoom .close { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font: inherit; font-size: 13px; color: #fff; background: rgb(0 0 0 / 0.6); border: 1px solid rgb(255 255 255 / 0.4); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
</style>

<div class="layout">
  <nav id="nav" aria-label="Contents">
    <div class="brandrow"><div class="brand"><span>Eldr</span> documentation<small>Hydra/Vulkan renderer for VFX</small><!--BUILT--></div>
      <button id="theme" type="button" aria-label="Switch between light and dark">Dark</button></div>
    <input id="q" type="search" placeholder="Search settings and text" aria-label="Search">
    <div class="hits" id="hits" aria-live="polite"></div>
    <div class="jumps" id="jumps"></div>
    <div class="toc" id="toc"></div>
  </nav>
  <main><article id="content">Loading…</article></main>
  <aside id="otp" aria-label="On this page"></aside>
</div>
<button id="top" type="button" class="hidden">Back to top</button>
<button id="menu" type="button" aria-controls="nav" aria-expanded="false">Contents</button>
<dialog id="zoom" aria-label="Picture"><div class="pane"><div><img alt=""><p></p></div></div><button class="close" type="button">Close</button></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script id="docs" type="application/json">/*DOCS*/[]</script>
<script>
const DOCS = JSON.parse(document.getElementById("docs").textContent);
const slug = t => t.toLowerCase().trim().replace(/[^\p{L}\p{N} _-]/gu, "").replace(/ /g, "-");
const content = document.getElementById("content"), toc = document.getElementById("toc");
content.textContent = "";
const chapters = new Map();  // id -> {sec, link, subs}
let part = "";

for (const [i, d] of DOCS.entries()) {
  const sec = document.createElement("section");
  sec.className = "doc"; sec.id = d.id;
  sec.innerHTML = marked.parse(d.md);
  // Headings get "<doc>-<slug>" ids; links to "x.md#y" (also "../x.md", "guide/x.md") go to "#x-y".
  sec.querySelectorAll("h1,h2,h3").forEach(h => { h.id = h.tagName === "H1" ? d.id : d.id + "-" + slug(h.textContent); });
  sec.querySelectorAll("a[href]").forEach(a => {
    const m = a.getAttribute("href").match(/^(?:\.\.\/|guide\/)?([\w-]+)\.md(?:#(.*))?$/) || a.getAttribute("href").match(/^()#(.*)$/);
    // Setting cards keep their own ids (#eldr-<name>) wherever they are linked from.
    if (m) a.setAttribute("href", "#" + (m[2] && m[2].startsWith("eldr-") && (!m[1] || m[1] === "settings") ? m[2] : (m[1] || d.id) + (m[2] ? "-" + m[2] : "")));
  });
  // Code blocks: a copy button.
  sec.querySelectorAll("pre").forEach(pre => {
    const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = "Copy";
    b.addEventListener("click", () => {
      const text = pre.querySelector("code")?.textContent ?? pre.textContent;
      const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => {
        const r = document.createRange(); r.selectNodeContents(pre.querySelector("code") || pre);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        try { document.execCommand("copy"); done(); } catch (err) { b.textContent = "Press Ctrl+C"; }
      });
    });
    pre.append(b);
  });
  // Pictures: the alt text becomes the caption; a paragraph of pictures only becomes a grid.
  sec.querySelectorAll("p").forEach(p => {
    const imgs = p.querySelectorAll("img");
    if (!imgs.length || p.textContent.trim()) return;
    const grid = document.createElement("div"); grid.className = "figs";
    for (const img of imgs) {
      const fig = document.createElement("figure"), cap = document.createElement("figcaption");
      cap.textContent = img.alt; img.loading = "lazy";
      // A picture not taken yet (Houdini screenshots) shows as a labelled box.
      img.onerror = () => { const s = document.createElement("div"); s.className = "shot"; s.textContent = "Screenshot to come: " + img.alt; img.replaceWith(s); };
      fig.append(img, cap); grid.append(fig);
    }
    p.replaceWith(grid);
  });
  sec.querySelectorAll("blockquote").forEach(b => {
    const k = (b.querySelector("strong")?.textContent || "").toLowerCase();
    const c = k.startsWith("tip") ? "tip" : k.startsWith("warning") ? "warning" : k.startsWith("note") ? "note" : k.startsWith("where in houdini") ? "houdini" : "";
    if (c) b.classList.add(c);
  });
  // Comparison cells that start with Yes / Partial / No get a coloured badge.
  sec.querySelectorAll("td").forEach(td => {
    const m = td.innerHTML.match(/^(Yes|Partial|No)\b/);
    if (m) td.innerHTML = td.innerHTML.replace(m[1], `<span class="yn ${m[1].toLowerCase()}">${m[1]}</span>`);
  });
  sec.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.append(t); });
  // Group each h2 with what follows it, so search can hide whole parts.
  let grp = null;
  for (const k of [...sec.children]) {
    if (k.tagName === "H2") { grp = document.createElement("div"); grp.className = "part"; k.before(grp); }
    if (grp) grp.append(k);
  }
  // Previous / next chapter.
  const pager = document.createElement("nav"); pager.className = "pager";
  for (const [j, cls, label] of [[i - 1, "prev", "Previous"], [i + 1, "next", "Next"]]) {
    if (!DOCS[j]) continue;
    const a = document.createElement("a"); a.className = cls; a.href = "#" + DOCS[j].id;
    a.innerHTML = `<small>${label}</small>`; a.append(DOCS[j].title); pager.append(a);
  }
  sec.append(pager);
  content.append(sec);
  if (d.part !== part) { part = d.part; const h = document.createElement("div"); h.className = "part"; h.textContent = part; toc.append(h); }
  const link = document.createElement("a"); link.className = "chapter"; link.href = "#" + d.id; link.textContent = d.title; toc.append(link);
  const subs = document.createElement("div"); subs.className = "subs"; toc.append(subs);
  sec.querySelectorAll("h2").forEach(h => { const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent; subs.append(a); });
  chapters.set(d.id, { sec, link, subs });
}

// Show the chapter that holds the hash's target, then scroll to it.
const otp = document.getElementById("otp");
function show(id = decodeURIComponent(location.hash.slice(1))) {
  const target = (id && document.getElementById(id)) || content.querySelector("section.doc");
  const sec = target.closest("section.doc");
  for (const [id, c] of chapters) {
    const on = c.sec === sec;
    c.sec.classList.toggle("current", on); c.link.classList.toggle("active", on); c.subs.classList.toggle("open", on);
  }
  // On this page: the chapter's h2 and h3 headings.
  const hs = [...sec.querySelectorAll("h2, h3")];
  otp.innerHTML = hs.length ? '<div class="h">On this page</div>' : "";
  for (const h of hs) { const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent; a.className = h.tagName.toLowerCase(); otp.append(a); }
  // A folded settings group opens to show its card.
  for (let p = target.closest("details"); p; p = p.parentElement.closest("details")) p.open = true;
  content.querySelectorAll(".setting.target").forEach(s => s.classList.remove("target"));
  if (target.classList.contains("setting")) target.classList.add("target");
  if (target === sec) window.scrollTo(0, 0); else target.scrollIntoView();
}
window.addEventListener("hashchange", () => show());
// In-page links switch chapters themselves: some hosts (data: URLs, sandboxed frames) don't update the hash.
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.pushState(null, "", "#" + id); } catch (err) {}
  show(id);
});
show();

// Highlight the section in view.
const links = new Map([...toc.querySelectorAll(".subs a")].map(a => [a.getAttribute("href").slice(1), a]));
const spy = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) {
    toc.querySelectorAll(".subs a.active").forEach(a => a.classList.remove("active"));
    const a = links.get(e.target.id); if (a) { a.classList.add("active"); a.scrollIntoView({ block: "nearest" }); }
    const o = otp.querySelector(`a[href="#${CSS.escape(e.target.id)}"]`);
    if (o) { otp.querySelectorAll("a.active").forEach(x => x.classList.remove("active")); o.classList.add("active"); }
  }
}, { rootMargin: "0px 0px -75% 0px" });
content.querySelectorAll("h2, h3").forEach(h => spy.observe(h));

// Back to top, once the page is scrolled.
const topBtn = document.getElementById("top");
addEventListener("scroll", () => topBtn.classList.toggle("hidden", scrollY < 600), { passive: true });
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

// Light / dark: follows the system until toggled; the choice is remembered in this browser.
const themeBtn = document.getElementById("theme");
const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const label = () => themeBtn.textContent = dark() ? "Light" : "Dark";
try { const t = localStorage.getItem("eldr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
label();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", label);
themeBtn.addEventListener("click", () => {
  const t = dark() ? "light" : "dark";
  document.documentElement.dataset.theme = t; label();
  try { localStorage.setItem("eldr-theme", t); } catch (err) {}
});

// Search runs over every chapter: blocks that don't match are hidden, parts with no match collapse,
// and the nav dims them.
const q = document.getElementById("q"), hits = document.getElementById("hits");
const BLOCKS = "tbody tr, li, p, pre, h3, figure, .setting, .card";
const blocks = [...content.querySelectorAll(BLOCKS)];
// Jump list: headings and settings whose title (or setting key) matches, best first; Enter opens the first.
const jumps = document.getElementById("jumps");
const targets = [...content.querySelectorAll("h1, h2, h3, .setting")].map(el => {
  const title = el.classList.contains("setting") ? el.querySelector("h4 .anchor").textContent : el.textContent;
  const key = el.classList.contains("setting") ? el.id.replace(/^eldr-/, "eldr:") : "";
  return { el, title, key, hay: (title + " " + key).toLowerCase(), where: chapters.get(el.closest("section.doc").id).link.textContent };
});
function jumpList(t) {
  jumps.textContent = "";
  if (!t) return;
  const found = targets.filter(x => x.hay.includes(t))
    .sort((a, b) => (b.title.toLowerCase().startsWith(t) - a.title.toLowerCase().startsWith(t)) || a.title.length - b.title.length)
    .slice(0, 10);
  for (const x of found) {
    const a = document.createElement("a"); a.href = "#" + x.el.id; a.textContent = x.title;
    const s = document.createElement("small"); s.textContent = x.key || x.where; a.append(s); jumps.append(a);
  }
}
function jump(a) { const h = a.getAttribute("href"); q.value = ""; search(); try { history.pushState(null, "", h); } catch (err) {} show(h.slice(1)); }
jumps.addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); e.stopPropagation(); jump(a); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && jumps.firstElementChild) { e.preventDefault(); jump(jumps.firstElementChild); } });
const original = new Map();
function search() {
  const t = q.value.trim().toLowerCase();
  document.body.classList.toggle("searching", !!t);
  for (const [el, html] of original) el.innerHTML = html;
  original.clear();
  let n = 0;
  for (const b of blocks) {
    const ok = !t || b.textContent.toLowerCase().includes(t);
    b.classList.toggle("hidden", !ok);
    if (ok && t) { n++; mark(b, t); }
  }
  content.querySelectorAll(".part").forEach(p => {
    const any = !t || p.querySelector("h2").textContent.toLowerCase().includes(t) || [...p.querySelectorAll(BLOCKS)].some(b => !b.classList.contains("hidden"));
    p.classList.toggle("hidden", !any);
    if (any && t) p.querySelectorAll("table").forEach(tb => tb.closest(".tw").classList.toggle("hidden", !tb.querySelector("tbody tr:not(.hidden)")));
    const a = links.get(p.querySelector("h2").id); if (a) a.classList.toggle("dim", !any);
  });
  // Folded settings groups open while searching and fold back after.
  content.querySelectorAll("details.sgroup").forEach(g => { if (t) { if (!g.open) { g.dataset.folded = "1"; g.open = true; } } else if (g.dataset.folded) { delete g.dataset.folded; g.open = false; } });
  jumpList(t);
  if (!t) { content.querySelectorAll(".tw.hidden").forEach(w => w.classList.remove("hidden")); show(); }
  hits.textContent = t ? `${n} matching ${n === 1 ? "block" : "blocks"}` : "";
}
function mark(el, t) {
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
  if (!nodes.some(x => x.nodeValue.toLowerCase().includes(t))) return;
  original.set(el, el.innerHTML);
  for (const node of nodes) {
    const i = node.nodeValue.toLowerCase().indexOf(t); if (i < 0) continue;
    const m = document.createElement("mark"); const r = node.splitText(i); r.splitText(t.length);
    m.textContent = r.nodeValue; r.replaceWith(m);
  }
}
let timer; q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 120); });
// Clicking a result while searching ends the search and opens its chapter.
toc.addEventListener("click", e => { if (e.target.tagName === "A" && q.value) { q.value = ""; search(); } });

// Phone: the nav slides in from the left.
const nav = document.getElementById("nav"), menu = document.getElementById("menu");
menu.addEventListener("click", () => { const o = nav.classList.toggle("open"); menu.setAttribute("aria-expanded", o); });
toc.addEventListener("click", e => { if (e.target.tagName === "A") { nav.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); } });

// A click on a picture opens it fitted to the window; clicking it again shows it at full size (scroll to pan).
const zoom = document.getElementById("zoom"), zimg = zoom.querySelector("img"), zcap = zoom.querySelector("p");
content.addEventListener("click", e => {
  if (e.target.tagName !== "IMG" || e.target.closest("a")) return;
  zimg.src = e.target.currentSrc || e.target.src; zimg.alt = e.target.alt; zcap.textContent = e.target.alt;
  zoom.classList.remove("full"); zoom.showModal();
});
zimg.addEventListener("click", e => { e.stopPropagation(); zoom.classList.toggle("full"); });
zoom.addEventListener("click", () => zoom.close());  // outside the picture, or the Close button
</script>
